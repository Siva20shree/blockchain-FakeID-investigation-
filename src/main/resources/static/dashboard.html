<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeriChain LE | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0D0D0F; --bg-secondary: #1A1A1E; --bg-card: #242428; --bg-hover: #2E2E34;
            --text-primary: #E8E8EC; --text-secondary: #8B8B94; --text-muted: #5C5C66;
            --border-default: #2E2E34; --accent-primary: #00D4FF; --status-verified: #10B981;
            --status-warning: #F59E0B; --status-threat: #EF4444; --status-pending: #8B5CF6;
            --font-mono: "JetBrains Mono", monospace; --font-sans: "Inter", sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-sans); background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }
        .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
        .sidebar { background: var(--bg-secondary); border-right: 1px solid var(--border-default); padding: 16px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 4px; color: var(--text-secondary); cursor: pointer; margin-bottom: 4px; }
        .nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
        .nav-item.active { background: rgba(0,212,255,0.1); color: var(--accent-primary); border-left: 3px solid var(--accent-primary); }
        .main { padding: 24px; background: var(--bg-primary); }
        .header { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
        .logo { font-family: var(--font-mono); font-weight: 600; font-size: 18px; }
        .logo span { background: linear-gradient(135deg, var(--accent-primary), #3B82F6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border-default); border-radius: 6px; padding: 16px; }
        .stat-label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .stat-value { font-family: var(--font-mono); font-size: 28px; font-weight: 600; }
        .card { background: var(--bg-card); border: 1px solid var(--border-default); border-radius: 6px; margin-bottom: 20px; }
        .card-header { padding: 12px 16px; border-bottom: 1px solid var(--border-default); font-weight: 600; }
        .card-body { padding: 16px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 10px 12px; font-size: 10px; color: var(--text-muted); text-transform: uppercase; background: var(--bg-secondary); }
        td { padding: 12px; font-size: 12px; border-bottom: 1px solid var(--border-default); }
        tr:hover { background: var(--bg-hover); }
        .badge { display: inline-flex; padding: 3px 8px; border-radius: 12px; font-size: 10px; font-weight: 600; text-transform: uppercase; }
        .badge.verified { background: rgba(16,185,129,0.15); color: var(--status-verified); }
        .badge.warning { background: rgba(245,158,11,0.15); color: var(--status-warning); }
        .badge.threat { background: rgba(239,68,68,0.15); color: var(--status-threat); }
        .badge.high { background: rgba(239,68,68,0.15); color: var(--status-threat); }
        .badge.medium { background: rgba(245,158,11,0.15); color: var(--status-warning); }
        .badge.low { background: rgba(16,185,129,0.15); color: var(--status-verified); }
        .badge.critical { background: rgba(239,68,68,0.25); border: 1px solid var(--status-threat); }
        .hash { font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); padding: 2px 6px; background: var(--bg-secondary); border-radius: 2px; }
        .content-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
        .activity-item { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border-default); }
        .activity-icon { width: 28px; height: 28px; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
        .activity-icon.scan { background: rgba(0,212,255,0.15); color: var(--accent-primary); }
        .activity-icon.alert { background: rgba(239,68,68,0.15); color: var(--status-threat); }
        .activity-icon.lock { background: rgba(139,92,246,0.15); color: var(--status-pending); }
        .activity-icon.verify { background: rgba(16,185,129,0.15); color: var(--status-verified); }
        .activity-icon svg { width: 14px; height: 14px; }
        .activity-text { font-size: 12px; color: var(--text-primary); }
        .activity-time { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
        .statusbar { grid-column: 1/-1; background: var(--bg-secondary); border-top: 1px solid var(--border-default); padding: 8px 16px; display: flex; justify-content: space-between; font-size: 11px; color: var(--text-secondary); }
        .tool-input { width: 100%; padding: 12px; background: var(--bg-secondary); border: 1px solid var(--border-default); color: var(--text-primary); border-radius: 4px; margin-bottom: 10px; }
        .tool-btn { padding: 10px 20px; background: var(--accent-primary); border: none; color: #000; border-radius: 4px; cursor: pointer; font-weight: 600; }
        .tool-btn:hover { opacity: 0.9; }
        .tool-output { background: var(--bg-secondary); border: 1px solid var(--border-default); border-radius: 4px; padding: 15px; margin-top: 15px; max-height: 300px; overflow: auto; font-family: var(--font-mono); font-size: 12px; white-space: pre-wrap; }
        .scan-input { padding: 10px; background: var(--bg-secondary); border: 1px solid var(--border-default); color: var(--text-primary); border-radius: 4px; }
        .criteria-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-default); font-size: 12px; }
        .criteria-item:last-child { border-bottom: none; }
    </style>
</head>
<body>
    <div class="app">
        <nav class="sidebar">
            <div class="header">
                <div class="logo"><span>VeriChain LE</span></div>
            </div>
            <div class="nav-item" id="nav-dashboard" onclick="switchView('dashboard')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                Dashboard
            </div>
            <div class="nav-item" id="nav-scanner" onclick="switchView('scanner')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                Scanner
            </div>
            <div class="nav-item" id="nav-evidence" onclick="switchView('evidence')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                Evidence
            </div>
            <div class="nav-item" id="nav-reports" onclick="switchView('reports')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>
                Reports
            </div>
        </nav>
        <main class="main" id="mainContent">
        </main>
    </div>
    <div class="statusbar">
        <span id="statusBar">VeriChain LE | Loading...</span>
        <span id="timestamp"></span>
    </div>
    <script>
        const mockStats = { profilesScanned: 12847, activeCases: 47, fakeDetected: 3291, evidenceLocked: 8934 };
        const mockInvestigations = [
            { id: "CASE-2024-0847", profile: "@crypto_king_999", platform: "twitter", risk: 87, status: "threat", date: "2024-01-15" },
            { id: "CASE-2024-0846", profile: "john.smith_official", platform: "facebook", risk: 62, status: "warning", date: "2024-01-14" },
            { id: "CASE-2024-0845", profile: "@invest_alerts", platform: "twitter", risk: 94, status: "threat", date: "2024-01-14" },
            { id: "CASE-2024-0844", profile: "sarah.tech.linkedin", platform: "linkedin", risk: 12, status: "verified", date: "2024-01-13" },
            { id: "CASE-2024-0843", profile: "@free_followers_now", platform: "instagram", risk: 78, status: "warning", date: "2024-01-12" }
        ];
        const mockEvidence = [
            { id: "EV-8A3F2C", profile: "@crypto_king_999", platform: "twitter", hash: "a7f3b2c1...", investigator: "J. Doe", timestamp: "2024-01-15T14:32:00" },
            { id: "EV-7B2E1D", profile: "john.smith_official", platform: "facebook", hash: "9d4ae3f2...", investigator: "M. Smith", timestamp: "2024-01-14T10:15:00" },
            { id: "EV-6C1D0C", profile: "@invest_alerts", platform: "twitter", hash: "2f8ba1c9...", investigator: "J. Doe", timestamp: "2024-01-14T09:45:00" },
            { id: "EV-5D0E9B", profile: "sarah.tech.linkedin", platform: "linkedin", hash: "4c2df8a7...", investigator: "A. Lee", timestamp: "2024-01-13T16:20:00" },
            { id: "EV-4E1F8A", profile: "@free_followers_now", platform: "instagram", hash: "8f3ad7b6...", investigator: "M. Smith", timestamp: "2024-01-12T11:08:00" }
        ];
        const mockActivity = [
            { type: "scan", text: "Profile @crypto_king_999 scanned successfully", time: "2 minutes ago" },
            { type: "alert", text: "High risk profile detected: @fake_news_agency (Risk: 91%)", time: "15 minutes ago" },
            { type: "lock", text: "Evidence EV-8A3F2C locked to blockchain", time: "32 minutes ago" },
            { type: "verify", text: "Profile sarah.tech.linkedin verified as authentic", time: "1 hour ago" },
            { type: "scan", text: "Profile john.smith_official scanned successfully", time: "2 hours ago" }
        ];

        function getIcon(type) {
            const icons = { scan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>', lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>', alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>', verify: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>' };
            return icons[type] || icons.scan;
        }

        function switchView(view) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById('nav-' + view).classList.add('active');
            const main = document.getElementById('mainContent');
            
            if (view === 'dashboard') {
                main.innerHTML = `<div class="header"><div class="logo"><span>VeriChain LE</span> — Dashboard</div></div>
                    <div class="stats-grid">
                        <div class="stat-card"><div class="stat-label">Profiles Scanned</div><div class="stat-value">${mockStats.profilesScanned.toLocaleString()}</div></div>
                        <div class="stat-card"><div class="stat-label">Active Cases</div><div class="stat-value">${mockStats.activeCases}</div></div>
                        <div class="stat-card"><div class="stat-label">Fake Detected</div><div class="stat-value">${mockStats.fakeDetected.toLocaleString()}</div></div>
                        <div class="stat-card"><div class="stat-label">Evidence Locked</div><div class="stat-value">${mockStats.evidenceLocked.toLocaleString()}</div></div>
                    </div>
                    <div class="content-grid">
                        <div class="card"><div class="card-header">Active Investigations</div><div class="card-body"><table><thead><tr><th>Case ID</th><th>Profile</th><th>Platform</th><th>Risk</th><th>Status</th><th>Date</th></tr></thead><tbody>${mockInvestigations.map(inv => `<tr><td><span class="hash">${inv.id}</span></td><td>${inv.profile}</td><td>${inv.platform}</td><td style="color:${inv.risk>=75?'var(--status-threat)':inv.risk>=50?'var(--status-warning)':'var(--status-verified)'}">${inv.risk}</td><td><span class="badge ${inv.status}">${inv.status}</span></td><td>${inv.date}</td></tr>`).join('')}</tbody></table></div></div>
                        <div class="card"><div class="card-header">Recent Activity</div><div class="card-body">${mockActivity.map(act => `<div class="activity-item"><div class="activity-icon ${act.type}">${getIcon(act.type)}</div><div class="activity-content"><div class="activity-text">${act.text}</div><div class="activity-time">${act.time}</div></div></div>`).join('')}</div></div>
                    </div>`;
            } else if (view === 'scanner') {
                main.innerHTML = `<div class="header"><div class="logo"><span>VeriChain LE</span> — Scanner</div></div>
                    <div class="card"><div class="card-header">Profile Scanner with Apify</div><div class="card-body">
                        <div style="display:flex;gap:10px;margin-bottom:15px">
                            <input type="text" id="scanProfile" class="scan-input" placeholder="@username" style="flex:1">
                            <select id="scanPlatform" class="scan-input" style="width:120px">
                                <option value="twitter">Twitter</option>
                                <option value="facebook">Facebook</option>
                                <option value="instagram">Instagram</option>
                                <option value="linkedin">LinkedIn</option>
                            </select>
                            <button onclick="runScan()" class="tool-btn">SCAN</button>
                        <div id="scanResults"></div>
                    </div></div>`;
            } else if (view === 'evidence') {
                main.innerHTML = `<div class="header"><div class="logo"><span>VeriChain LE</span> — Evidence</div></div>
                    <div class="card"><div class="card-header">Evidence Records</div><div class="card-body"><table><thead><tr><th>Evidence ID</th><th>Profile</th><th>Platform</th><th>Hash</th><th>Investigator</th><th>Timestamp</th></tr></thead><tbody>${mockEvidence.map(ev => `<tr><td><span class="hash">${ev.id}</span></td><td>${ev.profile}</td><td>${ev.platform}</td><td style="font-family:var(--font-mono);font-size:10px">${ev.hash}</td><td>${ev.investigator}</td><td>${ev.timestamp}</td></tr>`).join('')}</tbody></table></div></div>`;
            } else if (view === 'reports') {
                main.innerHTML = `<div class="header"><div class="logo"><span>VeriChain LE</span> — Reports</div></div>
                    <div class="card"><div class="card-header">Investigation Reports</div><div class="card-body"><table><thead><tr><th>Case ID</th><th>Profile</th><th>Risk</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead><tbody>${mockInvestigations.map(inv => `<tr><td><span class="hash">${inv.id}</span></td><td>${inv.profile}</td><td style="color:${inv.risk>=75?'var(--status-threat)':inv.risk>=50?'var(--status-warning)':'var(--status-verified)'}">${inv.risk}</td><td><span class="badge ${inv.status}">${inv.status}</span></td><td>${inv.date}</td><td><button style="padding:4px 10px;background:var(--bg-hover);border:1px solid var(--border-default);color:var(--text-primary);border-radius:4px;cursor:pointer">View</button></td></tr>`).join('')}</tbody></table></div></div>`;
            }
        }

        async function runScan() {
            const profile = document.getElementById('scanProfile').value;
            const platform = document.getElementById('scanPlatform').value;
            if (!profile) return alert('Enter a profile');
            const results = document.getElementById('scanResults');
            results.innerHTML = '<div style="padding:20px;text-align:center">Scanning...</div>';
            try {
                const res = await fetch('/api/scanner/scan', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ profile, platform }) });
                const data = await res.json();
                results.innerHTML = `<div class="card" style="margin-top:20px"><div class="card-header">Scan Results: @${data.username}</div><div class="card-body">
                    <div style="display:flex;justify-content:space-between;margin-bottom:15px">
                        <div><div style="color:var(--text-secondary);font-size:11px">Display Name</div><div style="font-size:16px;font-weight:600">${data.displayName}</div></div>
                        <div><div style="color:var(--text-secondary);font-size:11px">Created</div><div style="font-size:16px;font-weight:600">${data.created}</div></div>
                        <div><div style="color:var(--text-secondary);font-size:11px">Followers</div><div style="font-size:16px;font-weight:600">${data.followers}</div></div>
                        <div style="text-align:right"><div style="color:var(--text-secondary);font-size:11px">Risk Score</div><div style="font-size:24px;font-weight:700;color:${data.riskScore>=75?'var(--status-threat)':data.riskScore>=50?'var(--status-warning)':'var(--status-verified)'}">${data.riskScore}</div></div>
                    </div>
                    <div style="border-top:1px solid var(--border-default);padding-top:15px"><div style="font-size:12px;font-weight:600;margin-bottom:10px">Risk Factors</div>${data.factors.map(f => `<div class="criteria-item"><span>${f.name}</span><span class="badge ${f.level}">${f.level.toUpperCase()}</span></div>`).join('')}</div>
                </div></div>`;
            } catch(e) {
                results.innerHTML = '<div style="padding:20px;color:var(--status-threat)">Error scanning profile</div>';
            }
        }

        document.getElementById('timestamp').textContent = new Date().toISOString().replace('T', ' ').substring(0, 19);
        document.getElementById('statusBar').textContent = 'VeriChain LE | API: CONNECTED';
        switchView('dashboard');
    </script>
</body>
</html>
